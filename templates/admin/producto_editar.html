{% extends "admin/base.html" %}

{% block titulo %}Editar producto{% endblock %}

{% block contenido %}
<form class="admin-form" method="post" enctype="multipart/form-data">

    <h2 class="admin-form-nombre">Ramo de flores frescas - M</h2>

    <section class="admin-bloque">
        <h3>Foto</h3>
        <div class="admin-foto placeholder"><i class="bi bi-flower1"></i></div>
        <input type="file" name="foto" accept="image/*">
    </section>

    <section class="admin-bloque">
        <h3>Calidad Estación</h3>
        <label class="admin-etiqueta" for="precio_estacion">Precio ($)</label>
        <input type="number" id="precio_estacion" name="precio_estacion" value="30200" min="0">
        <label class="admin-etiqueta" for="descripcion_estacion">Descripción</label>
        <textarea id="descripcion_estacion" name="descripcion_estacion" rows="4">Flores de estación, como: astromelias, dianthus, lisianthus...</textarea>
    </section>

    <section class="admin-bloque">
        <h3>Calidad Premium</h3>
        <label class="admin-etiqueta" for="precio_premium">Precio ($)</label>
        <input type="number" id="precio_premium" name="precio_premium" value="40000" min="0">
        <label class="admin-etiqueta" for="descripcion_premium">Descripción</label>
        <textarea id="descripcion_premium" name="descripcion_premium" rows="4">Mix de flores de estación y flores como: rosas, lillium, hortensias...</textarea>
    </section>

    <section class="admin-bloque">
        <h3>Colores disponibles</h3>
        <div class="admin-colores">
            <label><input type="checkbox" name="colores" value="Amarillo" checked> Amarillo</label>
            <label><input type="checkbox" name="colores" value="Crema" checked> Crema</label>
            <label><input type="checkbox" name="colores" value="Naranja"> Naranja</label>
            <label><input type="checkbox" name="colores" value="Rojo" checked> Rojo</label>
            <label><input type="checkbox" name="colores" value="Bordó"> Bordó</label>
            <label><input type="checkbox" name="colores" value="Rosado" checked> Rosado</label>
            <label><input type="checkbox" name="colores" value="Fucsia"> Fucsia</label>
            <label><input type="checkbox" name="colores" value="Verde"> Verde</label>
            <label><input type="checkbox" name="colores" value="Blanco" checked> Blanco</label>
            <label><input type="checkbox" name="colores" value="Salmón"> Salmón</label>
        </div>
    </section>

    <label class="admin-visible">
        <input type="checkbox" name="visible" checked> Visible en la tienda
    </label>

    <div class="admin-acciones">
        <button type="submit" class="admin-boton">Guardar cambios</button>
        <a href="/admin-preview/productos" class="admin-cancelar">Cancelar</a>
    </div>
</form>
{% endblock %}

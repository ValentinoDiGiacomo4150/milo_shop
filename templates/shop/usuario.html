<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuario</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/usuario.css') }}">
</head>

<body>
    <!--header-->
    <header class="encabezado">
        <div class="logo">
            <a href="/"><img
                    src="{{url_for('static',filename='images/logos/Milo Mayne_IsoLogo_26_R_MM_ISO_principal_N.png')}}"
                    alt="Milo Mayne"></a>
        </div>
        <nav class="menu">
            <a href="/">Inicio</a>
            <a href="/productos">Productos</a>
            <a href="/quien-soy">¿Quién soy?</a>
            <a href="/que-puedo-hacer">¿Qué puedo hacer?</a>
            <a href="/contacto">Contacto</a>
        </nav>
        <div class="iconos">
            <a href="/carrito" class="enlace-carrito">
                <img src="{{ url_for('static', filename='images/logos/shopping-cart-01.png') }}" alt="Carrito">
                <span class="contador-carrito" {% if cart_count==0 %}hidden{% endif %}>{{ cart_count }}</span>
            </a>
            <div class="cuenta-menu-container" style="position: relative; display: inline-block;">
                <a href="/cuenta" id="icono-cuenta-link" style="position: relative;">
                    <img src="{{ url_for('static', filename='images/logos/user.png') }}" alt="Cuenta">
                    <span id="punto-verde"
                        style="display: none; position: absolute; top: 0; right: 0; width: 10px; height: 10px; background-color: #2ecc71; border-radius: 50%; border: 2px solid #fff;"></span>
                </a>

                <!-- Menú desplegable de cuenta -->
                <div id="dropdown-cuenta" class="dropdown-content"
                    style="display: none; position: absolute; right: 0; background: white; border: 1px solid #ddd; padding: 12px; box-shadow: 0px 4px 12px rgba(0,0,0,0.1); border-radius: 8px; width: 220px; z-index: 100;">
                    <p id="dropdown-nombre" style="font-weight: bold; margin: 0 0 4px 0; color: #333;"></p>
                    <p id="dropdown-correo"
                        style="font-size: 0.85em; color: #666; margin: 0 0 10px 0; word-break: break-all;"></p>
                    <hr style="border: none; border-top: 1px solid #eee; margin: 8px 0;">
                    <button id="btn-cerrar-sesion"
                        style="width: 100%; background: #e74c3c; color: white; border: none; padding: 6px; border-radius: 4px; cursor: pointer;">Cerrar
                        sesión</button>
                </div>
            </div>
        </div>
    </header>

    <main class="usuario">

        <!--login-->
        <section class="usuario-columna">
            <h2>Iniciar sesión</h2>
            <form class="formulario" action="/login" method="post">
                <label for="login-usuario">Nombre de usuario o correo electrónico</label>
                <input type="text" id="login-usuario" name="usuario" autocomplete="username" required>

                <label for="login-clave">Contraseña</label>
                <div class="campo-password-container">
                    <input type="password" id="login-clave" name="clave" autocomplete="current-password" required>
                    <button type="button" id="toggle-login-clave" class="btn-toggle-password"
                        aria-label="Mostrar u ocultar contraseña">
                        <!-- SVG del ojito -->
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="#666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path
                                d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                            </path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>

                <label class="recordar">
                    <input type="checkbox" name="recordar">
                    Recordarme
                </label>

                <button type="submit">Iniciar sesión</button>
                <a href="#" id="olvide-clave" class="olvide">¿Olvidaste tu contraseña?</a>
            </form>
        </section>

        <!--sign up-->
        <section class="usuario-columna">
            <h2>Registrarme</h2>
            <form class="formulario" action="/registro" method="post">
                <label for="registro-usuario">Nombre de usuario</label>
                <input type="text" id="registro-usuario" name="usuario" autocomplete="username" required>

                <label for="registro-correo">Correo electrónico</label>
                <input type="email" id="registro-correo" name="correo" autocomplete="email" required>

                <!-- CORREGIDO: IDs únicos para el registro y autocomplete="new-password" -->
                <label for="registro-clave">Contraseña</label>
                <div class="campo-password-container">
                    <input type="password" id="registro-clave" name="clave" autocomplete="new-password" required>
                    <button type="button" id="toggle-registro-clave" class="btn-toggle-password"
                        aria-label="Mostrar u ocultar contraseña">
                        <!-- SVG del ojito -->
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="#666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path
                                d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                            </path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>

                <button type="submit">Registrarme</button>
            </form>
        </section>

    </main>

    <!--footer-->
    <footer class="pie">
        <div class="logo">
            <img src="{{url_for('static',filename='images/logos/Milo Mayne_IsoLogo_26_R_MM_ISO-LOGO_2_N.png')}}"
                alt="Milo Mayne">
        </div>
        <div class="redes">
            <a href="#"><img src="{{url_for('static',filename='images/logos/whatsapp.png')}}"></a>
            <a href="#"><img src="{{url_for('static',filename='images/logos/instagram.png')}}"></a>
            <a href="#"><img src="{{url_for('static',filename='images/logos/correo-electronico.png')}}"></a>
        </div>
        <p>Copyright © 2026 Milo Mayne. All Rights Reserved</p>
    </footer>
    <script src="{{url_for('static', filename='js/carrito.js')}}"></script>
    <script src="{{url_for('static', filename='js/sesion.js')}}"></script>
    <script src="{{ url_for('static', filename='js/contador.js') }}"></script>
</body>

</html>

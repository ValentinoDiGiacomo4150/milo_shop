<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de compras | Milo Mayne</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/carrito.css') }}">
</head>

<body>

    <header class="encabezado">
        <div class="logo">
            <a href="/"><img
                    src="{{ url_for('static', filename='images/logos/Milo Mayne_IsoLogo_26_R_MM_ISO_principal_N.png') }}"
                    alt="Milo Mayne"></a>
        </div>
        <nav class="menu">
            <a href="/">Inicio</a>
            <a href="/productos">Productos</a>
            <a href="/quien-soy">¿Quién soy?</a>
            <a href="/que-puedo-hacer">¿Qué puedo hacer?</a>
            <a href="/contacto">Contacto</a>
        </nav>
        <div class="iconos">
            <a href="/carrito" class="enlace-carrito">
                <img src="{{ url_for('static', filename='images/logos/shopping-cart-01.png') }}" alt="Carrito">
                <span class="contador-carrito" {% if cart_count == 0 %}hidden{% endif %}>{{ cart_count }}</span>
            </a>
            <div class="cuenta-menu-container" style="position: relative; display: inline-block;">
                <a href="/cuenta" id="icono-cuenta-link" style="position: relative;">
                    <img src="{{ url_for('static', filename='images/logos/user.png') }}" alt="Cuenta">
                    <span id="punto-verde"
                        style="display: none; position: absolute; top: 0; right: 0; width: 10px; height: 10px; background-color: #2ecc71; border-radius: 50%; border: 2px solid #fff;"></span>
                </a>

                <!-- Menú desplegable de cuenta -->
                <div id="dropdown-cuenta" class="dropdown-content"
                    style="display: none; position: absolute; right: 0; background: white; border: 1px solid #ddd; padding: 12px; box-shadow: 0px 4px 12px rgba(0,0,0,0.1); border-radius: 8px; width: 220px; z-index: 100;">
                    <p id="dropdown-nombre" style="font-weight: bold; margin: 0 0 4px 0; color: #333;"></p>
                    <p id="dropdown-correo"
                        style="font-size: 0.85em; color: #666; margin: 0 0 10px 0; word-break: break-all;"></p>
                    <hr style="border: none; border-top: 1px solid #eee; margin: 8px 0;">
                    <button id="btn-cerrar-sesion"
                        style="width: 100%; background: #e74c3c; color: white; border: none; padding: 6px; border-radius: 4px; cursor: pointer;">Cerrar
                        sesión</button>
                </div>
            </div>
        </div>
    </header>

    <section class="titulo-pagina">
        <h1>Carrito de compras</h1>
    </section>

    <main class="carrito">

        <!--detalles producto-->
        <section class="carrito-productos">
            <div id="lista-carrito"></div>
            <button id="vaciar" class="vaciar">Vaciar carrito</button>
        </section>

        <!--resumen compra-->
        <aside class="resumen">
            <h2>Resumen de compra</h2>
            <div id="bloque-envio">
                <h3>Envío</h3>
                <div class="codigo-postal">
                    <input type="text" placeholder="Ingrese su código postal...">
                    <button>Calcular</button>
                </div>
                <label class="opcion-envio">
                    <input type="radio" name="envio" data-costo="4150" checked>
                    Envío a domicilio - Correo argentino clásico <span>$4.150</span>
                </label>
                <label class="opcion-envio">
                    <input type="radio" name="envio" data-costo="3000">
                    Punto de retiro - <a href="#">VER DIRECCIONES</a> <span>$3.000</span>
                </label>
            </div>
            <div class="totales">
                <p>Subtotal <span id="subtotal">$0</span></p>
                <p>Adicionales <span id="adicionales">$0</span></p>
                <p>Envío <span id="envio">$0</span></p>
                <p class="total">Total <span id="total">$0</span></p>
            </div>
            <button class="pagar">Pagar</button>
        </aside>
    </main>

    <footer class="pie">
        <div class="logo">
            <img src="{{ url_for('static', filename='images/logos/Milo Mayne_IsoLogo_26_R_MM_ISO-LOGO_2_N.png') }}"
                alt="Milo Mayne">
        </div>
        <div class="redes">
            <a href="https://wa.me/5492616003474" target="_blank" rel="noopener">
                <img src="{{ url_for('static', filename='images/logos/whatsapp.png') }}" alt="WhatsApp">
            </a>
            <a href="https://www.instagram.com/mm.innovacionfloral" target="_blank" rel="noopener">
                <img src="{{ url_for('static', filename='images/logos/instagram.png') }}" alt="Instagram">
            </a>
            <a href="mailto:milomayne@gmail.com">
                <img src="{{ url_for('static', filename='images/logos/correo-electronico.png') }}"
                    alt="Correo electrónico">
            </a>
        </div>
        <p>Copyright © 2026 Milo Mayne. All Rights Reserved</p>
    </footer>

    <!-- INYECCIÓN CLAVE DE DATOS DESDE FLASK A JS -->
    <script>
        window.ITEMS_SERVER = {{ items | tojson }};
    </script>
    <script src="{{ url_for('static', filename='js/producto-data.js') }}"></script>
    <script src="{{ url_for('static', filename='js/contador.js') }}"></script>
    <script src="{{ url_for('static', filename='js/carrito.js') }}"></script>
    <script src="{{ url_for('static', filename='js/sesion.js') }}"></script>
</body>

</html>

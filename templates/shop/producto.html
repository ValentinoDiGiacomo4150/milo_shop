<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milo Mayne</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/producto.css') }}">
</head>

<body>

    <!-- HEADER -->
    <header class="encabezado">
        <div class="logo">
            <a href="/">
                <img src="{{ url_for('static', filename='images/logos/Milo Mayne_IsoLogo_26_R_MM_ISO_principal_N.png') }}" alt="Milo Mayne">
            </a>
        </div>

        <nav class="menu">
            <a href="/">Inicio</a>
            <a href="/productos">Productos</a>
            <a href="/quien-soy">¿Quién soy?</a>
            <a href="/que-puedo-hacer">¿Qué puedo hacer?</a>
            <a href="/contacto">Contacto</a>
        </nav>

        <div class="iconos">
            <a href="/carrito">
                <img src="{{ url_for('static', filename='images/logos/shopping-cart-01.png') }}" alt="Carrito">
            </a>
            <a href="/cuenta">
                <img src="{{ url_for('static', filename='images/logos/user.png') }}" alt="Cuenta">
            </a>
        </div>
    </header>


    <main class="pp">
        <!-- pp = pagina-producto -->
        <div class="pp-izq">
            <div class="pp-imagen placeholder"><i class="bi bi-flower1"></i></div>
            <section class="pp-detalles">
                <h2>Detalles</h2>
                <div id="detalles"></div>
            </section>
        </div>

        <div class="pp-der">
            <h1 id="titulo"></h1>
            <p id="precio" class="pp-precio"></p>

            <form id="form-compra">
                <fieldset id="bloque-colores">
                    <legend>Elegí el color de tu ramo</legend>
                    <div id="colores" class="pp-colores"></div>
                </fieldset>

                <fieldset id="bloque-calidad" hidden>
                    <legend>Elegí la calidad</legend>
                    <div id="calidades" class="pp-calidades"></div>
                </fieldset>

                <label for="dedicatoria">Escribí tu dedicatoria:</label>
                <textarea id="dedicatoria" rows="5"></textarea>

                <label for="adicionales">Adicionales:</label>
                <input type="text" id="adicionales">

                <div class="pp-compra">
                    <div class="pp-cantidad">
                        <span>CANTIDAD</span>
                        <div>
                            <button type="button" id="menos">−</button>
                            <input type="number" id="cantidad" value="1" min="1">
                            <button type="button" id="mas">+</button>
                        </div>
                    </div>
                    <button type="submit" id="btn-agregar" disabled>
                        <i class="bi bi-plus-lg"></i> Agregar al carrito
                    </button>
                </div>
                <p id="aviso-color" class="pp-aviso">Elegí al menos un color para continuar.</p>
            </form>

            <div id="bloque-whatsapp" hidden>
                <p>Este producto se coordina directamente con el florista.</p>
                <a id="btn-whatsapp" class="pp-whatsapp" target="_blank" rel="noopener">
                    <i class="bi bi-whatsapp"></i> Coordinar por WhatsApp
                </a>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="pie">
        <div class="logo">
            <img src="{{ url_for('static', filename='images/logos/Milo Mayne_IsoLogo_26_R_MM_ISO-LOGO_2_N.png') }}" alt="Milo Mayne">
        </div>

        <div class="redes">
            <a href="https://wa.me/5492616003474" target="_blank" rel="noopener">
                <img src="{{ url_for('static', filename='images/logos/whatsapp.png') }}" alt="WhatsApp">
            </a>
            <a href="https://www.instagram.com/mm.innovacionfloral" target="_blank" rel="noopener">
                <img src="{{ url_for('static', filename='images/logos/instagram.png') }}" alt="Instagram">
            </a>
            <a href="mailto:milomayne@gmail.com">
                <img src="{{ url_for('static', filename='images/logos/correo-electronico.png') }}" alt="Correo electrónico">
            </a>
        </div>

        <p>Copyright © 2026 Milo Mayne. All Rights Reserved</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/productos.js') }}"></script>
    <!-- Script externo de Bootstrap (CDN) -> Queda tal cual -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Scripts locales guardados en static/js/ -->
    <script src="{{ url_for('static', filename='js/producto-data.js') }}"></script>
    <script src="{{ url_for('static', filename='js/producto.js') }}"></script>

</body>

</html>
